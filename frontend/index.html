<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Análisis de exportación e inversión</title>
    <link rel="stylesheet" href="./css/app.css" />
    <!-- Iconos. El SVG es el principal; el .ico y el PNG son respaldo (algunos
         navegadores y el "agregar a inicio" de iOS no leen SVG). Los tres se
         generan desde el SVG con scripts/make_favicon.py. Viven en public/
         porque FastAPI solo sirve dist/assets/ (ver src/exportanalysis/api/main.py). -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#3a7d44" />
    <!-- Chart.js vendorizado (v4.4.3, UMD) para que la UI funcione sin internet.
         Vive en frontend/public/assets/ y Vite lo copia a dist/assets/.
         Para actualizarlo, ver el comentario en js/charts.js. -->
    <script src="/assets/chart.umd.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <!-- Hoja: marca de la app. SVG inline para seguir funcionando offline. -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
          </svg>
        </span>
        <div class="brand-copy">
          <p class="eyebrow">Agroexportación peruana · Trade Map</p>
          <h1>Análisis de exportación e inversión</h1>
        </div>
      </div>
    </header>

    <div id="controls"></div>
    <main id="app">
      <div class="alert">Cargando...</div>
    </main>

    <footer>
      <p>Análisis de exportación e inversión. Datos de comercio: Trade Map (Excel local, 100% offline). El arancel y los supuestos financieros no provienen de fuentes automáticas.</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
