# Netlify solo sirve la UI estatica (Vite): no puede correr Python.
#
# El build genera dist/ y ademas dist/_redirects (scripts/netlify-redirects.mjs),
# que reenvia /api y /health a la API para que el navegador vea un solo origen.
# La URL de la API se pasa por variable de entorno, no se escribe aqui:
#   Site configuration -> Environment variables -> API_URL = https://<tu-api>
[build]
  command = "npm ci && npm run build:netlify"
  publish = "dist"

[build.environment]
  # Node 20 termino su soporte en abril de 2026. Se usa 22, la misma rama con
  # la que el Dockerfile compila el frontend (node:22.23.4-alpine).
  NODE_VERSION = "22"
