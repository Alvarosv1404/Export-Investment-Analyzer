# Render Blueprint: UI + API en un solo servicio Docker.
#
# El Dockerfile compila el frontend con Node y FastAPI sirve dist/ + la API
# desde el mismo origen (un solo enlace, sin CORS y sin proxy).
#
# La app lee config/ y data/ del propio repositorio (config.py los ubica
# relativos al paquete), asi que no necesita disco, base de datos ni variables
# de entorno. Render inyecta PORT y el CMD del Dockerfile lo respeta.
#
# Plan `free`: 750 h/mes por workspace, 512 MB / 0.1 CPU. El servicio se duerme
# tras ~15 min sin trafico y la primera peticion tarda ~30-60 s en despertarlo
# (importar pandas es lo que pesa). Las instancias web free NO caducan a los 30
# dias; lo que caduca es Postgres free, que este proyecto no usa.
#
# Region `oregon` (US West) es la mas cercana a Peru de las que ofrece Render.
#
# El plan free no permite discos persistentes, y aqui no hacen falta: todo el
# estado vive en el repositorio.
services:
  - type: web
    name: export-investment-analyzer
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
