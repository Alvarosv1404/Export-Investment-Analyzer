[project]
name = "exportanalysis"
version = "0.1.0"
description = "Motor de analisis para evaluar inversiones en exportacion (mercado, competencia y viabilidad financiera) con datos publicos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "numpy-financial>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # El TestClient de starlette lo requiere. Se llama httpx2 porque es lo que
    # pide starlette en esta version; no es un error de tipeo.
    "httpx2>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exportanalysis = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
