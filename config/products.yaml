    name: Café verde
    hs6: "090111"
    nandina: "0901119000"
    unit: kg
    industry: Agricola
    competitors: [76, 704, 170, 360, 340, 320]   # Brasil, Vietnam, Colombia, Indonesia, Honduras, Guatemala
