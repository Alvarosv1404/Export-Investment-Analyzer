# Catalogo de productos a analizar.
#
# PARA AGREGAR UN PRODUCTO NUEVO: copia un bloque de `products:` y cambia
# slug / name / hs6 / presentations. Nada mas. El pipeline, la API
# y el frontend lo recogen solo.
#
# AUN MAS SIMPLE: este archivo es opcional. Si dejas la data de un producto en
# `data/<hs6> <nombre>/` (con sus Excel de Trade Map), el producto se agrega al
# catalogo solo: el HS6 sale del nombre de la carpeta o de los archivos, y la
# partida SUNAT del Excel de 10 digitos. Declarar el producto aqui solo sirve
# para enriquecerlo (presentaciones, un nombre cuidado, un `industry` explicito).
# Si un HS6 ya esta declarado aqui, esta declaracion manda sobre lo detectado en
# data/.
#
#   competidores -> NO se declaran: se derivan de la data. El bloque de
#           competencia compara a Peru contra los mayores exportadores del ultimo
#           anio del Excel `exporting-economies_<hs6>.xlsx` (sin Peru ni la fila
#           "World"). El campo `competitors` sigue aceptandose como escape hatch
#           para imponer una lista propia, pero el default es la data.
#
# ORDENA LA DATA POR INDUSTRIA: si agrupas las carpetas por rubro, la industria
# tambien se infiere sola del nombre de la carpeta que las contiene:
#
#   data/<hs6> <nombre>/               -> producto, sin industria
#   data/<industria>/<hs6> <nombre>/   -> producto con esa industria
#
#   data/Agricola/080510 naranja fresca/
#   data/Pesquero/030743 pota calamar congelado/
#
#   hs6  -> presentacion PRINCIPAL, a 6 digitos. Debe coincidir con
#           presentations[0].hs6. Es la que usa el pipeline como cabecera.
#
#   presentations -> lista de presentaciones comerciales del mismo producto.
#           Ejemplo: el cacao es grano (180100), pasta (180310) o manteca
#           (180400). La primera DEBE ser la misma que `hs6`. Si omites la
#           lista, el producto queda con una sola presentacion (su `hs6`).
#
#   nandina -> partida SUNAT de 10 digitos de la presentacion principal.
#           Opcional. Sirve para cruzar con los Excel de SUNAT; los primeros 6
#           digitos son el HS6 (ver exportanalysis.sources.sunat).
#
#   industry -> sector del producto. Opcional pero recomendado: es lo que
#           permite agrupar y entender de que rubro es cada producto. Los
#           valores sugeridos viven en `INDUSTRIES` (config.py): Agricola,
#           Agroindustria, Pesquero, Minero, Metales, Textil, Quimico,
#           Hidrocarburos, Servicios. La lista NO es cerrada: si tu producto es
#           de otro rubro, escribe el que corresponda. Si omites `industry`, se
#           toma el nombre de la carpeta de industria que contiene la data (y si
#           el producto esta suelto en data/, queda sin industria).
#
# Fuentes: Trade Map (demanda mundial y competidores) y SUNAT (exportaciones
# peruanas). Ambas se muestran en campos separados porque NO siempre coinciden:
# la discrepancia es parte del analisis, no un error a esconder.
#
# Los FOB 2024 citados son el ranking agroexportador de MIDAGRI para contexto.

defaults:
  years: 5            # ventana de analisis hacia atras desde el ultimo ano completo
  reporter: 604       # 604 = Peru (codigo M49, ver countries.yaml)
  flow: X             # X = exportaciones, M = importaciones

